<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<style>
@media (prefers-reduced-motion:no-preference){
  line,path{stroke-dasharray:720;stroke-dashoffset:720;animation:draw 2.2s cubic-bezier(.2,.85,.35,1) forwards}
  circle{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
  rect{transition:filter .3s ease, opacity .3s ease}
  svg:hover rect{filter:saturate(1.08)}
  text{animation:fade .9s ease both}
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.018);opacity:.88}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>

<title id="title">Beauty Days journey</title>
<desc id="desc">Event energy converts into community continuity, sponsor value and platform intelligence.</desc>
<rect width="960" height="360" rx="36" fill="#FAF7F0"/>
<path d="M92 180 H868" stroke="#7A2D3A" stroke-width="3" stroke-dasharray="10 12" opacity=".65"/>
<g font-family="Inter, sans-serif">
<g transform="translate(58 102)"><circle cx="78" cy="78" r="58" fill="#3D4A35"/><text x="78" y="72" text-anchor="middle" font-size="19" font-weight="650" fill="#FAF7F0">RSVP</text><text x="78" y="96" text-anchor="middle" font-size="10" letter-spacing="2" fill="#8B2E3B">DEMAND</text></g>
<g transform="translate(236 102)"><circle cx="78" cy="78" r="58" fill="#FFFFFF" stroke="#2A2A2A" stroke-opacity=".12"/><text x="78" y="72" text-anchor="middle" font-size="19" font-weight="650" fill="#2A2A2A">Attend</text><text x="78" y="96" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7A2D3A">TRUST</text></g>
<g transform="translate(414 102)"><circle cx="78" cy="78" r="58" fill="#FFFFFF" stroke="#2A2A2A" stroke-opacity=".12"/><text x="78" y="72" text-anchor="middle" font-size="19" font-weight="650" fill="#2A2A2A">Activate</text><text x="78" y="96" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7A2D3A">SPONSOR</text></g>
<g transform="translate(592 102)"><circle cx="78" cy="78" r="58" fill="#FFFFFF" stroke="#2A2A2A" stroke-opacity=".12"/><text x="78" y="72" text-anchor="middle" font-size="19" font-weight="650" fill="#2A2A2A">Retain</text><text x="78" y="96" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7A2D3A">MEMBER</text></g>
<g transform="translate(770 102)"><circle cx="78" cy="78" r="58" fill="#C9A86C"/><text x="78" y="72" text-anchor="middle" font-size="19" font-weight="650" fill="#3D4A35">Compound</text><text x="78" y="96" text-anchor="middle" font-size="10" letter-spacing="2" fill="#3D4A35">DATA</text></g>
</g>
<text x="480" y="310" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#6F665E">Beauty Days turns an event spike into a year-round community, partner and intelligence loop.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<style>
@media (prefers-reduced-motion:no-preference){
  line,path{stroke-dasharray:720;stroke-dashoffset:720;animation:draw 2.2s cubic-bezier(.2,.85,.35,1) forwards}
  circle{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
  rect{transition:filter .3s ease, opacity .3s ease}
  svg:hover rect{filter:saturate(1.08)}
  text{animation:fade .9s ease both}
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.018);opacity:.88}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>

<title id="title">Founder bottleneck to operating leverage</title>
<desc id="desc">Deck-native diagram translating Ciarra as bottleneck into an AI-supported operating layer.</desc>
<defs>
  <linearGradient id="charcoal" x1="0" x2="1"><stop stop-color="#0B0F12"/><stop offset="1" stop-color="#1A1D21"/></linearGradient>
  <linearGradient id="teal" x1="0" x2="1"><stop stop-color="#1FB6B8"/><stop offset="1" stop-color="#0F7A7C"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0B0F12" flood-opacity=".18"/></filter>
</defs>
<rect width="960" height="520" rx="36" fill="#F6F1E8"/>
<rect x="34" y="34" width="892" height="452" rx="28" fill="#FFFFFF" stroke="#151515" stroke-opacity=".1" filter="url(#shadow)"/>
<text x="82" y="92" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="3" fill="#0F7A7C">YOUR TIME IS THE BOTTLENECK</text>
<text x="82" y="132" font-family="Inter, sans-serif" font-size="42" font-weight="650" fill="#151515">Today</text>
<text x="620" y="132" font-family="Inter, sans-serif" font-size="42" font-weight="650" fill="#151515">With Miojo OS</text>
<g transform="translate(84 185)">
  <rect x="120" y="72" width="146" height="88" rx="24" fill="url(#charcoal)"/>
  <text x="193" y="107" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="650" fill="#FBF7F0">CIARRA</text>
  <text x="193" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#1FB6B8">BOTTLENECK</text>
  <g fill="#FBF7F0" stroke="#151515" stroke-opacity=".12">
    <rect x="0" y="0" width="124" height="52" rx="18"/><rect x="262" y="0" width="124" height="52" rx="18"/><rect x="0" y="184" width="124" height="52" rx="18"/><rect x="262" y="184" width="124" height="52" rx="18"/>
  </g>
  <g font-family="Inter, sans-serif" font-size="15" fill="#2F2B28"><text x="62" y="32" text-anchor="middle">Events</text><text x="324" y="32" text-anchor="middle">Clients</text><text x="62" y="216" text-anchor="middle">Sourcing</text><text x="324" y="216" text-anchor="middle">Brands</text></g>
  <g stroke="#E68A3F" stroke-width="2" opacity=".9"><path d="M124 52 L170 78"/><path d="M262 52 L216 78"/><path d="M124 184 L170 154"/><path d="M262 184 L216 154"/></g>
</g>
<path d="M460 260 C495 260 505 260 540 260" stroke="#0F7A7C" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0F7A7C"/></marker></defs>
<g transform="translate(572 176)">
  <rect x="110" y="0" width="166" height="72" rx="22" fill="url(#charcoal)"/>
  <text x="193" y="31" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="650" fill="#FBF7F0">Founder Command</text>
  <text x="193" y="54" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="2" fill="#1FB6B8">HUMAN-LED</text>
  <g fill="#FBF7F0" stroke="#151515" stroke-opacity=".12">
    <rect x="0" y="130" width="118" height="58" rx="18"/><rect x="134" y="130" width="118" height="58" rx="18"/><rect x="268" y="130" width="118" height="58" rx="18"/>
  </g>
  <g font-family="Inter, sans-serif" font-size="14" fill="#2F2B28"><text x="59" y="164" text-anchor="middle">Memory</text><text x="193" y="164" text-anchor="middle">Signal</text><text x="327" y="164" text-anchor="middle">Execution</text></g>
  <g stroke="url(#teal)" stroke-width="2"><path d="M193 72 L59 130"/><path d="M193 72 L193 130"/><path d="M193 72 L327 130"/></g>
</g>
</svg>

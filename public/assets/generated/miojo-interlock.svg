<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<style>
@media (prefers-reduced-motion:no-preference){
  line,path{stroke-dasharray:720;stroke-dashoffset:720;animation:draw 2.2s cubic-bezier(.2,.85,.35,1) forwards}
  circle{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
  rect{transition:filter .3s ease, opacity .3s ease}
  svg:hover rect{filter:saturate(1.08)}
  text{animation:fade .9s ease both}
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.018);opacity:.88}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>

<title id="title">Miojo interlock map</title>
<desc id="desc">Miojo shown as one founder-led platform with multiple expressions across creative, community, wellness, hospitality, commerce and culture.</desc>
<defs><radialGradient id="g" cx="50%" cy="50%" r="55%"><stop stop-color="#8B2E3B" stop-opacity=".22"/><stop offset="1" stop-color="#3D4A35" stop-opacity="0"/></radialGradient></defs>
<rect width="960" height="640" rx="40" fill="#3D4A35"/>
<rect width="960" height="640" rx="40" fill="url(#g)"/>
<g opacity=".11" stroke="#FAF7F0"><path d="M80 120h800M80 240h800M80 360h800M80 480h800M200 80v480M360 80v480M520 80v480M680 80v480M840 80v480"/></g>
<circle cx="480" cy="320" r="214" fill="none" stroke="#8B2E3B" stroke-opacity=".32" stroke-width="2"/>
<circle cx="480" cy="320" r="142" fill="none" stroke="#C9A86C" stroke-opacity=".28" stroke-width="2"/>
<circle cx="480" cy="320" r="92" fill="#4A5240" stroke="#8B2E3B" stroke-opacity=".65" stroke-width="2"/>
<text x="480" y="308" text-anchor="middle" font-family="Inter, sans-serif" font-size="25" font-weight="650" fill="#FAF7F0">Ciarra / Miojo</text>
<text x="480" y="340" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="3" fill="#8B2E3B">SHARED ENGINE</text>
<g font-family="Inter, sans-serif" font-size="20" font-weight="620" fill="#FAF7F0">
  <text x="480" y="104" text-anchor="middle">Creative</text><text x="758" y="238" text-anchor="middle">Community</text><text x="720" y="520" text-anchor="middle">Commerce</text><text x="244" y="520" text-anchor="middle">Hospitality</text><text x="202" y="238" text-anchor="middle">Wellness</text><text x="480" y="572" text-anchor="middle">Culture</text>
</g>
